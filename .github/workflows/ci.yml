name: Plugin CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_package:
        description: Infernux 0.4.8+ package name or wheel URL
        default: infernux>=0.4.8
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sdk-requirements.txt
      - name: Install Vulkan loader for the published Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanRT.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.328.1/windows/VulkanRT-X64-1.4.328.1-Installer.exe' -OutFile $installer
          $installation = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($installation.ExitCode -ne 0) { throw "Vulkan Runtime installation failed: $($installation.ExitCode)" }
      - name: Install current SDK
        env:
          SDK_PACKAGE: ${{ inputs.sdk_package || vars.INFERNUX_SDK_PACKAGE || 'infernux>=0.4.8' }}
        run: python -m pip install --upgrade "$env:SDK_PACKAGE" -r sdk-requirements.txt
      - run: python -m compileall -q package
      - run: python examples/quick_start.py
      - run: python -m pytest
      - name: Export plugin
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python package.py --tag "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ runner.os }}
          path: |
            out/*.inxpkg
            out/infernux-plugin-release.json
            out/official-registry-entry.json
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-Windows
          path: out
      - name: Publish package and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/*.inxpkg out/infernux-plugin-release.json out/official-registry-entry.json --verify-tag --title "Infernux Tween ${{ github.ref_name }}" --generate-notes
